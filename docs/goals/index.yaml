# docs/goals/index.yaml - queue state. Status changes: orchestrator only, via the
# claim protocol in the dispatch skill.
# status: not_started | in_progress | completed | blocked
config:
  base: master
  model: inherit
  skills: []
  # A BARE pytest, deliberately. pyproject.toml's addopts already deselect the
  # full_season, warehouse and network marks. Passing -m on the command line
  # REPLACES that filter rather than adding to it, which is how
  # .github/workflows/ci.yml currently re-enables the network mark by accident.
  # Goal 008 fixes CI; this file must not repeat the mistake meanwhile.
  verify:
    - ruff check .
    - ruff format --check .
    - pytest
goals:
  001-rebuild-revised-game: {status: completed, priority: high}
  002-wire-rebuild-into-settlement: {status: in_progress, priority: high, depends_on: [001-rebuild-revised-game]}
  003-gate-newly-loaded-games: {status: not_started, priority: high}
  004-live-season-progress: {status: not_started, priority: high}
  005-nightly-run-summary: {status: not_started, depends_on: [002-wire-rebuild-into-settlement, 003-gate-newly-loaded-games]}
  006-possession-fkey-scope: {status: not_started}
  007-points-archive-gap: {status: not_started}
  008-ci-marker-filter: {status: not_started, priority: high}
  009-roster-endpoint-recon: {status: not_started, depends_on: [008-ci-marker-filter]}
  010-requery-view-timings: {status: not_started}
  011-roadmap-matches-reality: {status: not_started}
