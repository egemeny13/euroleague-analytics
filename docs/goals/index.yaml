# docs/goals/index.yaml - queue state. Status changes: orchestrator only, via the
# claim protocol in the dispatch skill.
# status: not_started | in_progress | completed | blocked
config:
  base: master
  model: inherit
  skills: []
  # A BARE pytest, deliberately. pyproject.toml's addopts already deselect the
  # full_season, warehouse and network marks. Passing -m on the command line
  # REPLACES that filter rather than adding to it, which is how
  # .github/workflows/ci.yml currently re-enables the network mark by accident.
  # Goal 008 fixes CI; this file must not repeat the mistake meanwhile.
  verify:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest
goals:
  001-rebuild-revised-game: {status: completed, priority: high}
  002-wire-rebuild-into-settlement: {status: completed, priority: high, depends_on: [001-rebuild-revised-game]}
  003-gate-newly-loaded-games: {status: completed, priority: high}
  004-live-season-progress: {status: completed, priority: high}
  005-nightly-run-summary: {status: completed, depends_on: [002-wire-rebuild-into-settlement, 003-gate-newly-loaded-games]}
  006-possession-fkey-scope: {status: completed}
  007-points-archive-gap: {status: completed}
  008-ci-marker-filter: {status: completed, priority: high}
  009-roster-endpoint-recon: {status: completed, depends_on: [008-ci-marker-filter]}
  010-requery-view-timings: {status: completed}
  011-roadmap-matches-reality: {status: completed}
  012-on-off-season-scope: {status: completed, priority: high}
  013-redact-database-url-errors: {status: completed, priority: high}
  014-exact-pagination-totals: {status: completed, priority: high}
  015-strict-boolean-arguments: {status: completed, priority: high}
  016-stable-pagination-order: {status: completed}
  017-bounded-name-ambiguity: {status: completed}
  018-pooler-username-validation: {status: completed, priority: high}
  019-settlement-rebuild-docstring: {status: not_started}
  020-redact-env-example-project: {status: not_started}
  021-readme-current-claims: {status: not_started}
  022-python-version-guard: {status: not_started, depends_on: [021-readme-current-claims]}
  023-tester-reporting-route: {status: not_started, depends_on: [020-redact-env-example-project]}
