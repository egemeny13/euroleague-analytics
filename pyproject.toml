[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "euroleague-analytics"
version = "0.1.0"
description = "A validated data warehouse for EuroLeague and EuroCup basketball, built from the public play-by-play API."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Egemen Yucelen" }]

# Dependencies are pinned in requirements.txt rather than listed here, so that
# there is exactly one place to look. See that file for why the pins stop at
# direct dependencies.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unregistered marker rather than silently skipping the test.
#
# The default marker filter is a safety belt, not a preference. One of the
# `warehouse` tests reloads the whole Phase 5 layer to prove the load is
# idempotent, so a bare `pytest` used to write to the production database. It
# left the data correct and the tables 111 MB bloated with dead tuples, which
# is a confusing way to discover the default was wrong. Opting in is now
# explicit: `pytest -m warehouse` to run the live gates.
addopts = "--strict-markers --strict-config -q -m 'not full_season and not warehouse and not network'"
markers = [
    "full_season: reads the complete response cache, which is not committed. Excluded by the default addopts filter.",
    "warehouse: connects to and WRITES TO the configured private Supabase warehouse. Excluded by the default addopts filter; opt in with -m warehouse.",
    "network: reaches the real EuroLeague API. Excluded by default.",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

# The exploration scripts are the throwaway instruments that produced
# FINDINGS.md and SEASON_SWEEP.md. They are kept so the measurements can be
# reproduced, not maintained as pipeline code, and reformatting them would
# edit the evidence. Excluded deliberately.
#
# `docs` is excluded for the same reason. The plan and report documents quote
# code as it stood when they were written; ruff reformats fenced Python inside
# markdown, which would silently edit the record. Found on 2026-08-13, when
# `ruff format --check .` failed on a committed Phase 7 plan document and would
# have turned CI red on the next push.
extend-exclude = ["exploration", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
