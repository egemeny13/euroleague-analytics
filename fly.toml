# fly.toml app configuration file generated for euroleague-analytics-mcp on 2026-08-28T00:16:17+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'euroleague-analytics-mcp'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  # Decision 86: suspend when idle and resume on an incoming request. Normal
  # resume retains process memory; cold-start fallback can lose MCP sessions.
  # The historical stdio timing report does not measure Fly wake latency.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # A FLOOR, not a ceiling. `fly launch` created TWO machines and this line did
  # not stop it; both ran always-on at $2.02 each until `fly scale count 1` on
  # 2026-08-28. Machine count lives in `fly scale`, not in this file, so check
  # `fly scale show` after any launch or clone - and note that the per-subject
  # rate cap in ratelimit.py is per process, so a second machine silently
  # doubles every allowance as well as the bill.
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  # Decision 89: no [[http_service.checks]] block. With a 30 s /healthz check
  # the proxy cordoned the machine every ~6 min and flyd uncordoned it ~25 s
  # later, and it never suspended. Restore a check only after showing the
  # machine still suspends with it in place.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
