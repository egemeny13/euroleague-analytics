# fly.toml app configuration file generated for euroleague-analytics-mcp on 2026-08-28T00:16:17+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'euroleague-analytics-mcp'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  # Decision 86: suspend when idle and resume on an incoming request. It has
  # never taken effect: the proxy cordons the machine every ~6 min and flyd
  # uncordons it ~20 s later. 'stop' failed the same way (Decision 91), so the
  # cause is not the suspend mechanism, and 'suspend' is kept because it loses
  # no MCP sessions if the platform ever honours it.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # A FLOOR, not a ceiling. `fly launch` created TWO machines and this line did
  # not stop it; both ran always-on at $2.02 each until `fly scale count 1` on
  # 2026-08-28. Machine count lives in `fly scale`, not in this file, so check
  # `fly scale show` after any launch or clone - and note that the per-subject
  # rate cap in ratelimit.py is per process, so a second machine silently
  # doubles every allowance as well as the bill.
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  # Decision 89 removed this check to test whether it blocked idle suspension.
  # It did not: the machine failed to suspend the same way without it, so the
  # check is restored.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
