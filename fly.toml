app = "euroleague-analytics-mcp"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always on. docs/MCP_CONNECTION_LIFECYCLE_REPORT.md measured 1,612 ms for a
  # first call against 606 ms warm; scaling to zero makes every question a
  # first call, and adds container start on top.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
