name: E2026 live pipeline

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2026-live-fetcher
  cancel-in-progress: false

jobs:
  daily-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The production credentials are deliberately NOT declared here. A job-level
    # env block hands them to every step, including `pip install`, which runs
    # setup code from packages this repository does not write. The three steps
    # that reach the database and Storage declare them individually.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Fetch and archive newly played E2026 games
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_archive.py E2026 --live --require-fresh-schedule --cache-root .live-cache

      # Loads and derives only the games the warehouse is missing, then leaves
      # the season alone. Safe to re-run: a second run finds nothing new, which
      # is what makes a retry after a failed fetch safe rather than duplicating.
      #
      # It restores the complete season cache from the archive first. That is a
      # cache read, not a re-fetch: the derived build needs every played game
      # present or Decision 3's minutes correction would be recomputed from
      # whatever subset this run happened to fetch. See src/euroleague/live.py.
      - name: Load and derive newly played E2026 games
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/live_pipeline.py E2026 --live --cache-root .live-cache

      # Decision 7's condition, open since 2026-08-09 and impossible to satisfy
      # retrospectively: a game played in October cannot be observed six hours
      # after the fact in December. Runs even when the steps above loaded
      # nothing, because a game played days ago still owes its later readings.
      #
      # A re-fetch is an audit: the observation is always recorded, a second
      # body is stored only when the checksum differs, and no history is ever
      # overwritten. Current archive checksums are compared with durable
      # applied checksums on every run, so a failed repair remains pending and
      # is retried from a private archive snapshot rather than forgotten.
      - name: Take Decision 7 settlement readings
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/settlement_recheck.py E2026 --live
