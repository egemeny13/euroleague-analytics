# Archive the remaining historical seasons without anybody naming them.
#
# WHAT CHANGED, AND WHO CHANGED IT. The plan behind the historical archive
# (docs/superpowers/plans/2026-08-23-09-historical-archive-expansion.md) says
# "do not start the next batch automatically", and .github/workflows/
# historical-archive.yml exists in the shape it does because of that sentence.
# Egemen Yücelen relaxed the condition on 2026-08-29, in preference to typing a
# season code every two hours for thirty-eight hours. That decision is recorded
# as DECISIONS.md item 31, together with what it gives up.
#
# The manual workflow is untouched and still works. This one runs beside it.
#
# WHAT REPLACES THE HUMAN. The operator was never really choosing - the order is
# newest first back to E2007 - they were noticing when something came back wrong.
# Two steps do that noticing here:
#
#   * scripts/next_archive_season.py refuses to guess. It picks the newest season
#     whose archived schedule does not have all three endpoints for every played
#     game, compares gamecodes rather than counts, and returns nothing at all if
#     it cannot read the archive.
#   * scripts/verify_archive_season.py runs the plan's step 4 gate in the same
#     job that did the fetching. Before this, the gate was run by hand afterwards,
#     which is precisely the step that stops happening once nobody is watching.
#
# A season that cannot be finished is therefore picked again on the next run,
# and fails the gate again, loudly and repeatedly. That is the intended
# behaviour: a stalled chain in plain sight beats a chain that moves on quietly.
# Each retry is cheap, because the fetcher never re-requests a permanent 404.

name: Historical archive chain

on:
  # THE SCHEDULE IS GONE, AND THAT IS THE CHAIN FINISHING RATHER THAN BREAKING.
  # Decision 31 said to disable this workflow once no unarchived season remained,
  # and Decision 52 records the day it arrived: E2021 back to E2007 are archived,
  # and E2006 and older are not fetchable at all - the API answers every game
  # endpoint for them with HTTP 200 and zero bytes, measured 2026-09-03. A cron
  # here would now wake ten times a day to fetch nothing.
  #
  # If a season is ever found short, dispatch this by hand. Two guards survive
  # for that run and are why the chooser still checks the clock:
  #
  #   * The nightly E2026 job runs at 03:43 UTC in the same concurrency group,
  #     and GitHub cancels a *pending* run when a newer one joins that group. A
  #     chain run queued at 04:00 while the live run waits its turn would cancel
  #     it rather than delay it.
  #   * blocks_the_live_job() in src/euroleague/archive_chain.py guards the moment
  #     a run *starts*, which is not the same moment. A run can sit pending behind
  #     a two-hour fetch and begin at 01:40, finishing at about 04:00 with the
  #     live job stuck behind it. Only the job knows when it actually started, so
  #     the chooser checks the clock and picks nothing.
  workflow_dispatch:

permissions:
  contents: read

# Deliberately the same group as e2026-live.yml and historical-archive.yml.
# One fetcher against the undocumented public API, always. cancel-in-progress
# stays false for the reason it is false in both of those: a cancelled live
# fetch loses that night's games, a delayed historical batch loses nothing.
concurrency:
  group: e2026-live-fetcher
  cancel-in-progress: false

jobs:
  archive-next-season:
    runs-on: ubuntu-latest
    # E2022 measured 328 played games at three endpoints and 9.94 s per request:
    # 2 h 43 m. The largest season left is E2021 at 299 played games. This clears
    # both with room and stays under GitHub's own six-hour ceiling.
    timeout-minutes: 330
    # The production credentials are deliberately NOT declared here. A job-level
    # env block hands them to every step, including `pip install`, which executes
    # setup code from packages this repository does not write. The three steps
    # that genuinely reach the database and Storage declare them individually.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      # Reads the archive; fetches nothing. An empty `season` output means either
      # that every season from E2021 back to E2007 is archived, or that this run
      # started inside the window reserved for the nightly E2026 job - the step's
      # own log line says which. Either way the run stops rather than finding
      # something to do. --ignore-live-window is for a supervised manual run and
      # must never appear here; a test asserts that.
      - name: Choose the next unarchived season
        id: choose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/next_archive_season.py --github-output

      # --archive refuses E2026 itself, so the nightly season cannot be fetched
      # here even if the chooser were wrong about which season is next.
      #
      # The season reaches both commands below as an environment variable rather
      # than as `${{ ... }}` inside the command text. It comes from our own
      # chooser script and not from a person, so this is defence in depth rather
      # than a hole being closed - but a step output is still a string the shell
      # would parse as code, and the rule is cheaper to keep than to reason about
      # case by case.
      - name: Restore, fetch and archive that season
        if: steps.choose.outputs.season != ''
        env:
          SEASON: ${{ steps.choose.outputs.season }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/fetch_archive.py "$SEASON" \
            --archive --cache-root .archive-cache

      # The gate. Downloads every archived object back out of Storage, verifies
      # each against its own checksum, requires the exact played gamecodes, and
      # cross-checks the byte totals PostgreSQL and Storage recorded separately.
      # A failure here fails the job and stops the chain advancing.
      - name: Verify the season restores byte for byte
        if: steps.choose.outputs.season != ''
        env:
          SEASON: ${{ steps.choose.outputs.season }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_archive_season.py "$SEASON"

      - name: Report that the backfill is finished
        if: steps.choose.outputs.season == ''
        run: |
          echo "No unarchived historical season remains. This workflow can be" \
               "disabled, and DECISIONS.md item 31 says to disable it."
