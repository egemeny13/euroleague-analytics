# Restore and verify one already archived EuroLeague season.
#
# WHY THIS WORKFLOW EXISTS. historical-archive.yml uploads a named season but
# never runs the restore gate. The archive chain does run the gate, but E2020's
# gate failed on a Supabase read timeout while another fetch was writing there on
# 2026-08-30. The chooser checks whether a season was fetched, not whether it was
# verified, so the chain moved on to E2019. That left E2020 and E2021 stored
# without a successful restore gate.
#
# This manual entry point makes the existing gate repeatable without requiring
# a laptop that holds production credentials. It only downloads archived
# objects, verifies their checksums and completeness, and compares byte totals;
# it does not fetch from the EuroLeague API or write to Supabase.

name: Verify archived season

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Archived season code to restore and verify, such as E2021."
        required: true
        type: string

permissions:
  contents: read

# The verifier makes no EuroLeague API request. It shares this group with the
# archive workflows because downloading from Supabase while an archive fetch
# was writing there caused the E2020 gate's read timeout on 2026-08-30.
concurrency:
  group: e2026-live-fetcher
  cancel-in-progress: false

jobs:
  verify-season:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Production credentials are step-scoped so dependency installation never
    # runs third-party setup code while holding them.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      # Pass the dispatch input through the environment so the shell treats it
      # as data. The verifier validates the season code again before using it.
      - name: Verify the archived season restores byte for byte
        env:
          SEASON: ${{ inputs.season }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_archive_season.py "$SEASON"
