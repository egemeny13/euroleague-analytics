name: Clutch measurement-path diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clutch-measurement-path
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DATABASE_URL is declared on the measuring step below, not here. A job-level
    # env block would also hand the database password to `pip install`, which runs
    # setup code from packages this repository does not write.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Measure clutch latency at named read-only boundaries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/measure_clutch_path.py --season E2024 --repetitions 7
