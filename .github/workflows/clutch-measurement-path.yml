name: Clutch measurement-path diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clutch-measurement-path
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Measure clutch latency at named read-only boundaries
        run: python scripts/measure_clutch_path.py --season E2024 --repetitions 7
