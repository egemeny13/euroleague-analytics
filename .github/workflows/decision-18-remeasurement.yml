name: Decision 18 live re-measurement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-18-live-remeasurement
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Measure Decision 18 query shapes in forced read-only sessions
        run: python scripts/measure_view_timings.py --season E2024 --repetitions 5 --sessions 2
