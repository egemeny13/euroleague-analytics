name: MCP connection lifecycle measurement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-connection-lifecycle
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Measure MCP connection lifecycle and end-to-end JSON-RPC latency
        run: python scripts/measure_mcp_lifecycle.py --season E2024 --repetitions 7 --processes 5
