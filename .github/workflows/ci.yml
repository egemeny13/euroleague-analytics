name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# This workflow holds no secrets and touches no database. It runs the
# committed fixtures only. The full 330-game validation needs the response
# cache, which is not in the repository, and arrives as a separate
# manually-triggered workflow once the archive is in Supabase Storage.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Bare `pytest` on purpose. The marker filter lives in one place -
      # `addopts` in pyproject.toml - and a `-m` here would override it rather
      # than add to it. This step used to name only `full_season` and
      # `warehouse`, which silently re-admitted the `network` and
      # `local_database` marks the default filter excludes. That would have
      # selected the three disposable-PostgreSQL rebuild gates, which need a
      # server on localhost:5433 and the uncommitted response cache. Neither
      # exists on a GitHub runner, so they would have failed rather than
      # skipped. Found on 2026-08-21.
      - name: Test
        run: pytest
