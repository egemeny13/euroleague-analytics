name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# This workflow holds no secrets and touches no database. It runs the
# committed fixtures only. The full 330-game validation needs the response
# cache, which is not in the repository, and arrives as a separate
# manually-triggered workflow once the archive is in Supabase Storage.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest
