name: SuperCup rehearsal live pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2026-live-fetcher
  cancel-in-progress: false

jobs:
  supercup-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The production credentials are deliberately NOT declared at the job level.
    # A job-level env block hands them to every step, including `pip install`,
    # which runs setup code from packages this repository does not write. The steps
    # that reach the database and Storage declare them individually.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Fetch and archive newly played SC2026 games
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_archive.py SC2026 --live --require-fresh-schedule --cache-root .live-cache

      # Loads and derives only the games the warehouse is missing.
      # Restores the complete season cache from the archive first so Decision 3's
      # correction check runs over the whole season.
      - name: Load and derive newly played SC2026 games
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/live_pipeline.py SC2026 --live --cache-root .live-cache
