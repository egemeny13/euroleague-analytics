<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EuroLeague Analytics — European basketball for your AI assistant</title>
<meta name="description" content="Connect EuroLeague play-by-play data to Claude, ChatGPT or Gemini and ask in your own words. Exact possessions, five-man lineups and shot locations, reconstructed from the play-by-play.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <a class="wordmark" href="/">
    <span class="wordmark-mark" aria-hidden="true"></span>
    EuroLeague Analytics
  </a>
  <nav class="topnav" aria-label="Main">
    <a class="quiet-link" href="https://github.com/egemeny13/euroleague-analytics">Source</a>
    <a class="button-solid" href="#connect">Connect</a>
  </nav>
</header>

<main id="main">

  <section class="hero">
    <!-- The attacking end of one half court, drawn to FIBA proportions at
         40 units per metre and anchored off the bottom-left corner. Only the
         marks a viewer recognises are kept — key, free-throw circle, hoop,
         backboard, three-point line. The sidelines and the halfway line are
         omitted on purpose: as straight full-length rules they read as page
         furniture rather than as a court. Nothing here moves. -->
    <svg class="courtlines" viewBox="0 0 560 620" fill="none" aria-hidden="true" focusable="false">
      <g stroke="currentColor" stroke-width="2.5">
        <path d="M0 46 H119.6 M0 574 H119.6"/>
        <path d="M119.6 46 A270 270 0 0 1 119.6 574"/>
        <rect x="0" y="212" width="232" height="196"/>
        <circle cx="232" cy="310" r="72"/>
        <path d="M25 274 V346"/>
        <circle cx="63" cy="310" r="18"/>
      </g>
    </svg>

    <div class="hero-inner">
      <div class="hero-copy">
        <h1>Add EuroLeague to the AI you already use.</h1>
        <p class="lede">
          Connect once, then ask in your own words — every lineup, every shot,
          every second on court. <strong>No app, no spreadsheet.</strong>
        </p>
        <div class="actions">
          <a class="button-solid button-lg" href="#connect">Connect</a>
          <a class="quiet-link" href="#how">See how it works</a>
        </div>
      </div>

      <div class="hero-demo">
        <figure class="window" aria-labelledby="demo-caption">
          <div class="window-bar">
            <span class="window-app">
              <span class="app-avatar" id="app-avatar" aria-hidden="true"></span>
              <span id="app-name">Claude</span>
            </span>
            <span class="window-state"><i class="live-dot" aria-hidden="true"></i>EuroLeague Analytics connected</span>
          </div>

          <!-- Nothing in here is ever added or removed while the page is open.
               Both the question and the answer hold their space from the first
               paint, so the window is a fixed object and the page underneath it
               never moves. -->
          <div class="window-body" id="thread">
            <div class="from-you">
              <!-- The hidden copy reserves the bubble's final size, so the
                   question types inside a bubble that never resizes. -->
              <p class="bubble-user">
                <span class="ask-ghost" aria-hidden="true">Which five-man lineup wins games for Fenerbahce?</span>
                <span class="ask-typed" id="ask"></span>
              </p>
            </div>

            <div class="reply" id="reply">
              <p class="reply-line">Their most efficient five this season:</p>
              <ul class="lineup">
                <li><span class="jersey" style="--club:#12305B">7</span>Hall</li>
                <li><span class="jersey" style="--club:#12305B">10</span>Wilbekin</li>
                <li><span class="jersey" style="--club:#12305B">33</span>Motley</li>
                <li><span class="jersey" style="--club:#12305B">1</span>Biberović</li>
                <li><span class="jersey" style="--club:#12305B">21</span>Sanli</li>
              </ul>
              <p class="verdict">
                <span class="figure">+21.6</span> net rating
                <span class="qualifier">over 184 possessions together</span>
              </p>
            </div>
          </div>

          <div class="window-input" aria-hidden="true">
            <span class="window-placeholder">Ask about any team, lineup or possession</span>
            <span class="window-send"></span>
          </div>
        </figure>
        <figcaption class="demo-caption" id="demo-caption">
          A recorded answer from the warehouse. Works the same in any assistant
          that speaks MCP.
        </figcaption>
      </div>
    </div>
  </section>

</main>

<script src="hero.js" defer></script>
</body>
</html>
