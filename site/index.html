<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EuroLeague Analytics — ask your AI why, not just who</title>
<meta name="description" content="Connect ChatGPT, Claude or Gemini to every play of every EuroLeague game, then ask what you actually want to know. Free, read-only, two minutes to set up.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/Archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="home.css">
<!-- The Turkish page is rebuilt after the English design settles, so the
     first-language redirect (Decision 53) is off on this branch. -->
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <a class="wordmark" href="./">EuroLeague Analytics</a>
  <a class="button button--small" href="#connect">Connect free</a>
</header>

<main id="main">
  <section class="hero">
    <h1>
      <span class="known">Your AI knows the score.</span>
      <span class="new">Now it knows <em>why.</em></span>
    </h1>

    <div class="hero-body">
      <div>
        <p class="lede">
          Connect ChatGPT, Claude or Gemini to every play of every EuroLeague
          game. Then ask what you actually want to know.
        </p>
        <a class="button" href="#connect">Connect it — free, two minutes</a>
        <p class="fineprint">Sign in with Google. Nothing to install. Nothing to pay.</p>
      </div>

      <!-- Every number in this conversation was read from the warehouse:
           E2025 game 406, the 2026 final. Team figures are the stored
           v_team_game row (possessions counted from events, not
           estimated); the five-man +9 is that lineup's own possessions in
           v_possession. Queried 2026-10-07. -->
      <figure class="chat" id="chat" aria-label="An assistant with EuroLeague Analytics connected, explaining why Olympiacos won the 2026 final">
        <div class="chat-head">
          <span class="on">Your assistant, with EuroLeague Analytics</span>
          <button class="replay" type="button" id="replay">Replay</button>
        </div>

        <div class="chat-body">
          <div class="msg ask" data-step="ask"><span class="type"><span class="ghost">Who won the EuroLeague final?</span><span class="typed"></span></span></div>

          <div class="msg reply reply--plain" data-step="reply">
            <p>Olympiacos, 92–85 over Real Madrid.</p>
          </div>

          <div class="msg ask" data-step="ask"><span class="type"><span class="ghost">Why? They gave the ball away 17 times.</span><span class="typed"></span></span></div>

          <div class="msg reply" data-step="working">
            <p class="working">Reading all 149 possessions of the final…</p>
          </div>

          <div class="msg reply" data-step="reply">
            <p>Because they won the extra chances back:</p>
            <ul class="facts">
              <li><span class="n" data-count="38.7" data-decimals="1" data-suffix="%">38.7%</span>
                <span>of their misses came back as offensive rebounds <span class="vs">— Madrid 18.9%</span></span></li>
              <li><span class="n" data-count="46.6" data-decimals="1">46.6</span>
                <span>free throws per 100 shots <span class="vs">— Madrid 28.1</span></span></li>
              <li><span class="n" data-count="9" data-decimals="0" data-prefix="+">+9</span>
                <span>Peters, Hall, Ward, Fournier and Joseph together, in 17 possessions</span></li>
            </ul>
          </div>
        </div>
        <figcaption class="source">A real answer, from the play-by-play of the 2026 final.</figcaption>
      </figure>
    </div>
  </section>
</main>

<script src="home.js"></script>
</body>
</html>
